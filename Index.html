    function exportPDF() { window.print(); }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration, type = 'sine', gainVal = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const SFX = {
      button: () => playTone(580, 0.08, 'sine', 0.15),

  <script>
    /* ==========================================================
       CLOUD AI GENERATOR (GEMINI API) DENGAN STRICT PROMPTING
       ========================================================== */
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function fetchWithRetry(url, options, maxRetries = 3) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const res = await fetch(url, options);
          if (res.ok) return res;
          if (res.status === 429) {
            await delay(Math.pow(2, i) * 1000);
            continue;
          }
          throw new Error(`HTTP error! status: ${res.status}`);
        } catch (e) {
          if (i === maxRetries - 1) throw e;
          await delay(Math.pow(2, i) * 1000);
        }
      }
    }

    async function generateQuestionsWithGemini(topic, count, difficulty, config) {
      const apiKey = ""; // Canvas runtime automatically injects
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const systemPrompt = `ATURAN WAJIB GENERATOR SOAL MATEMATIKA:
1. JUDUL MATERI ADALAH SUMBER UTAMA. Soal wajib mengikuti judul materi: "${topic}". JANGAN KELUAR DARI MATERI INI. Jika materi "Penjumlahan Pecahan", jangan buat perkalian pecahan. Jika "Bentuk Akar", wajib ada operasi bentuk akar.
2. SIMBOL MATEMATIKA WAJIB:
   - Gunakan simbol "×" (BUKAN * atau x).
   - Gunakan simbol "÷" (BUKAN / atau :).
   - Untuk desimal, gunakan tanda koma "," sesuai standar Indonesia (misal 2,5).
   - Untuk pangkat gunakan superscript "²", "³" atau format HTML <sup>2</sup>.
   - Untuk akar gunakan simbol "√".
3. PECAHAN VERTIKAL WAJIB:
   JANGAN PERNAH menampilkan pecahan seperti 1/2.
   SELALU gunakan format HTML ini untuk pecahan vertikal: <span class="math-frac"><span class="math-num">PEMBILANG</span><span class="math-den">PENYEBUT</span></span>.
   (Bungkus dengan <span class="math-expr"> jika digabung dengan teks lain agar sejajar secara visual).
4. VARIASI BENTUK PERTANYAAN:
   Jangan monoton hanya angka langsung. Gunakan ragam:
   - "Hitunglah hasil dari..."
   - "Berapakah nilai dari..."
   - "Sederhanakan bentuk..."
   - Soal cerita konstektual (jika relevan).
   - "Tentukan luas/volume/x..."
5. ATURAN JENIS JAWABAN:
   Jenis soal ini adalah: "${config.jenisJawaban}".
   - Jika "Pilihan Ganda": Pada properti JSON "q", tambahkan teks pilihan A, B, C, D di bawah pertanyaan menggunakan tag <br>. Pada properti "ans", cantumkan abjad jawaban benar saja (misal: "B") atau lengkap ("B. 15").
   - Jika "Isian Singkat": Properti "q" hanya pertanyaan saja. Properti "ans" hanya angka/teks jawaban singkat akhir (misal: "125" atau "2,5").
6. KONSISTENSI & VALIDASI INTERNAL:
   - Periksa ulang perhitungan matematika. Pastikan benar 100%.
   - Kunci jawaban (ans) harus relevan dengan hasil.
   - Pembahasan (exp) harus rinci menjabarkan langkah atau rumus mendapatkan "ans".`;

      const userPrompt = `Buatlah tepat ${count} soal matematika.
Materi: ${topic}.
Tingkat Kesulitan: ${difficulty}.
Instruksi Tambahan Guru: ${config.instruksi || 'Tidak ada instruksi spesifik, ikuti aturan sistem.'}.
Pastikan JSON output sesuai schema.`;

      const payload = {
        contents: [{ role: "user", parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                id: { type: "NUMBER" },
                q: { type: "STRING" },
                ans: { type: "STRING" },
                exp: { type: "STRING" },
                type: { type: "STRING" }
              }
            }
          }
        }
      };

      try {
        const response = await fetchWithRetry(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts) {
          const jsonText = result.candidates[0].content.parts[0].text;
          return JSON.parse(jsonText);
        }
        throw new Error("Format respon AI tidak valid.");
      } catch (err) {
        console.error("Gemini API Error:", err);
        throw err;
      }
    }
  </script>

    function filterTopicGrid() { const q = document.getElementById('topic-search').value.toLowerCase().trim(); document.querySelectorAll('#topic-grid > div').forEach(el => { el.style.display = (el.getAttribute('data-title').includes(q) || el.getAttribute('data-num').includes(q)) ? 'flex' : 'none'; }); }
    function getTopicNameWithNumber(idx) { return idx === -1 ? (activeWorkspace.customTopicTitle || "Custom Materi") : `${String(idx + 1).padStart(3, '0')}. ${TOPICS_DATABASE[idx] || ''}`; }
    function selectDatabaseTopic(idx) { activeWorkspace.selectedTopicIndex = idx; updateAITargetText(); saveLocalData(); renderStep1(); SFX.selection(); }
    function selectCustomTopic() { activeWorkspace.selectedTopicIndex = -1; if (!activeWorkspace.customTopicTitle) activeWorkspace.customTopicTitle = "Matematika Khusus"; updateAITargetText(); saveLocalData(); renderStep1(); SFX.selection(); }
    function saveCustomTopicTitle() { const val = document.getElementById('custom-topic-input').value.trim(); if(val) { activeWorkspace.customTopicTitle = val; updateAITargetText(); saveLocalData(); showModal("Disimpan", "Judul Custom Materi berhasil disimpan.", "success"); renderStep1(); } }
    function setQuestionCount(n) { activeWorkspace.gameConfig.questionCount = n; updateAITargetText(); saveLocalData(); renderStep1(); SFX.selection(); }
    function setDifficulty(d) { activeWorkspace.gameConfig.difficulty = d; updateAITargetText(); saveLocalData(); renderStep1(); SFX.selection(); }
    function setGameDuration(s, l) { activeWorkspace.gameConfig.durationSec = s; activeWorkspace.gameConfig.durationLabel = l; saveLocalData(); renderStep1(); SFX.selection(); }
    function applyCustomDurationText() { const val = document.getElementById('custom-dur-input').value.toLowerCase().trim(); const num = parseInt(val.replace(/[^0-9]/g, '')); if(isNaN(num) || num <= 0) { showModal("Format Salah", "Ketik angka. Cth: '12 Menit'.", "error"); return; } let sec = num; if(val.includes('menit') || val.includes('m')) sec = num * 60; else if (val.includes('jam') || val.includes('j')) sec = num * 3600; const labelFormat = val.replace(/\b\w/g, c => c.toUpperCase()); setGameDuration(sec, labelFormat); }
    function updateAI(field, val) { activeWorkspace.aiConfig[field] = val; saveLocalData(); }
    function updateAITargetText() { const ws = activeWorkspace; const cfg = ws.gameConfig; const curIdx = ws.selectedTopicIndex; ws.aiConfig.targetText = `Mencetak: ${cfg.questionCount} Soal • Materi: ${getTopicNameWithNumber(curIdx)} • Level: ${cfg.difficulty.toUpperCase()}`; }
    
    async function handleGenerateAI() {
      const ws = activeWorkspace; 
      const topic = ws.selectedTopicIndex === -1 ? ws.customTopicTitle : TOPICS_DATABASE[ws.selectedTopicIndex]; 
      const btn = document.getElementById('btn-generate-ai'); 
      
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> MEMPROSES CLOUD AI... HARAP TUNGGU`; 
      btn.disabled = true;
      SFX.button(); 
      
      try {
        const generatedQs = await generateQuestionsWithGemini(topic, ws.gameConfig.questionCount, ws.gameConfig.difficulty, ws.aiConfig);
        ws.questions = generatedQs;
        saveLocalData(); 
        SFX.victory(); 
        renderStep1(); 
      } catch (e) {
        showModal("Gagal Membuat Soal", "Gagal memanggil API Cloud AI. Silakan coba lagi.", "error");
        btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i> ✨ GENERATE SOAL CLOUD AI ✨`;
        btn.disabled = false;
        lucide.createIcons();
      }
    }

    function toggleKey(idx) { document.getElementById(`key-div-${idx}`).classList.toggle('hidden'); SFX.button(); }
    function copyQuestion(idx) { const q = activeWorkspace.questions[idx]; const text = `${q.q.replace(/<[^>]*>?/gm, '')}\n\nKunci: ${q.ans.replace(/<[^>]*>?/gm, '')}\nPembahasan: ${q.exp.replace(/<[^>]*>?/gm, '')}`; const dummy = document.createElement('textarea'); dummy.value = text; document.body.appendChild(dummy); dummy.select(); document.execCommand('copy'); document.body.removeChild(dummy); showModal("Tersalin", "Soal disalin.", "success"); SFX.button(); }
    function updateQ(idx, field, val) { activeWorkspace.questions[idx][field] = val; saveLocalData(); }
    function deleteQuestion(idx) { activeWorkspace.questions.splice(idx,1); saveLocalData(); renderStep1(); SFX.button(); }
    function clearAllQuestions() { if(confirm("Hapus seluruh soal?")) { activeWorkspace.questions = []; saveLocalData(); renderStep1(); SFX.wrong(); } }
    function addNewBlankQuestion() { activeWorkspace.questions.push({ id: Date.now(), q: "Ketik soal...", ans: "Jawaban", exp: "Pembahasan...", type: activeWorkspace.aiConfig.jenisJawaban==='Pilihan Ganda'?'mc':'essay' }); saveLocalData(); renderStep1(); SFX.button(); }

      for (let cols = 1; cols <= qCount; cols++) {
        const rows = Math.ceil(qCount / cols);
        const availW = (containerW - ((cols - 1) * gap)) / cols;
        const availH = (containerH - ((rows - 1) * gap)) / rows;
        let testW = availW; let testH = testW / aspect;
        if (testH > availH) { testH = availH; testW = testH * aspect; }
        if (testW > bestCardW && testW > 0 && testH > 0) { bestCardW = testW; bestCardH = testH; bestCols = cols; bestRows = rows; }
      }

      wrapper.style.display = 'grid';
      wrapper.style.gridTemplateColumns = `repeat(${bestCols}, ${bestCardW}px)`;
      wrapper.style.gridTemplateRows = `repeat(${bestRows}, ${bestCardH}px)`;
      wrapper.style.gap = `${gap}px`;
      wrapper.style.justifyContent = 'center';
      wrapper.style.alignContent = 'center';

      wrapper.innerHTML = activeWorkspace.questions.map((_, i) => {
        const answered = gameState.answeredIndices.has(i);
        return `
          <div onclick="${answered ? '' : `openQuestionModal(${i})`}" class="game-card group ${answered ? 'answered-correct' : ''}">
            <div class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full ${answered ? 'bg-emerald-500' : 'bg-brandCyan'}"></div><span class="text-[clamp(8px,1vw,10px)] ${answered ? 'text-emerald-500' : 'text-brandCyan'} font-mono uppercase tracking-wider">CARD</span></div>
            <div class="text-center my-auto flex items-center justify-center h-full"><h3 class="font-tech card-title text-white font-bold tracking-widest ${answered ? 'line-through opacity-50' : ''}">SOAL ${String(i+1).padStart(2,'0')}</h3></div>
            <div class="text-center"><span class="text-[clamp(8px,1vw,10px)] font-mono tracking-widest ${answered ? 'text-emerald-500 font-bold' : 'text-brandMuted group-hover:text-brandCyan'}">${answered ? 'TERJAWAB' : 'BUKA SOAL'}</span></div>
          </div>
        `;
      }).join('');
    }

    function openQuestionModal(idx) {
      SFX.selection();
      gameState.selectedCardIndex = idx;
      const q = activeWorkspace.questions[idx];
      const cfg = activeWorkspace.gameConfig;
      const numTeams = cfg.mode === 'solo' ? 1 : cfg.teamCount;
      const isPilgan = q.type === 'mc';

      const modal = document.createElement('div');
      modal.id = 'question-modal-view';
      modal.className = 'question-modal-container animate-fadeIn';
      
      modal.innerHTML = `
        <div class="q-modal-header flex items-center justify-between border-b border-brandCyan/20">
          <div class="border border-brandCyan/40 bg-brandPanel/50 px-3 py-1.5 rounded-full shadow-neon-cyan">
            <span class="font-tech font-bold text-brandCyan text-xs tracking-wider">KARTU SOAL #${idx+1}</span>
          </div>
          <button onclick="closeQuestionModal()" class="text-xs text-white border border-brandCyan/40 px-4 py-2 rounded-lg hover:bg-brandCyan/10 transition flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali
          </button>
        </div>

        <div class="q-modal-content-wrapper">
          <div class="q-modal-body">
            <div class="q-modal-text font-sans font-medium text-white">${q.q}</div>
          </div>

          <div class="q-modal-footer border-t border-brandCyan/20">
            <div class="adaptor-wrapper">
              ${Array.from({length: numTeams}).map((_, tIdx) => {
                const tName = cfg.mode==='solo'?'PESERTA SOLO':cfg.teamNames[tIdx];
                const boxBorder = cfg.mode==='solo' ? 'border-brandCyan/50' : (tIdx%2===0?'border-brandCyan/50':'border-red-500/50');
                const headerColor = cfg.mode==='solo' ? 'text-brandCyan' : (tIdx%2===0?'text-brandCyan':'text-red-400');
                
                return `
                  <div id="adaptor-${tIdx}" class="adaptor-box border ${boxBorder}">
                    <div class="flex items-center justify-between">
                      <span class="text-[11px] font-tech font-bold ${headerColor} tracking-wider truncate">${tName}</span>
                      <span class="text-[9px] text-brandMuted font-mono">ADAPTOR X</span>
                    </div>
                    
                    ${isPilgan ? `
                      <div class="grid grid-cols-2 gap-2 mt-2 flex-1">
                        ${['A','B','C','D'].map(opt => `
                          <button onclick="submitAnswer(${tIdx}, '${opt}')" class="bg-[#0a1224] border border-brandCyan/30 py-2 rounded-lg font-tech font-bold text-[clamp(14px,2vh,18px)] text-white hover:bg-brandCyan/20 transition shadow-sm h-full">${opt}</button>
                        `).join('')}
                      </div>
                    ` : `
                      <div class="adaptor-input-display">
                        <span id="ans-in-${tIdx}" class="font-tech text-white font-bold tracking-widest empty:before:content-['∅'] empty:before:text-brandMuted empty:before:font-sans flex items-center"></span>
                      </div>
                      <div class="adaptor-grid">
                        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="addNum(${tIdx}, '${n}')" class="adaptor-btn font-tech">${n}</button>`).join('')}
                        <button onclick="addNum(${tIdx}, '-')" class="adaptor-btn font-tech text-amber-400">-</button>
                        <button onclick="addNum(${tIdx}, '0')" class="adaptor-btn font-tech">0</button>
                        <button onclick="addNum(${tIdx}, ',')" class="adaptor-btn font-tech text-emerald-400">,</button>
                      </div>
                      <div class="flex gap-[clamp(3px,0.8vw,6px)] mt-[clamp(3px,0.8vw,6px)] h-[clamp(30px,5vh,40px)]">
                        <button onclick="addNum(${tIdx}, '/')" class="flex-none px-4 bg-[#0a1224] border border-brandCyan/30 text-white rounded font-tech text-[clamp(12px,1.8vh,18px)]" title="Tombol pecahan/garis miring">/</button>
                        <button onclick="delNum(${tIdx})" class="flex-none px-4 bg-[#2a0808] hover:bg-[#3d0b0b] border border-red-900/50 text-red-300 rounded font-bold text-[clamp(10px,1.5vh,12px)] transition-colors">DEL</button>
                        <button onclick="submitAnswer(${tIdx})" class="flex-1 bg-gradient-to-r from-brandBlue to-brandCyan text-black rounded font-bold text-[clamp(10px,1.5vh,14px)] tracking-widest shadow-neon-cyan transition-transform active:scale-95">JAWAB</button>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
      document.getElementById('gameplay-arena').appendChild(modal);
      lucide.createIcons();
    }

    function closeQuestionModal() { const m = document.getElementById('question-modal-view'); if(m) m.remove(); }
    function addNum(tIdx, val) { SFX.button(); const el = document.getElementById(`ans-in-${tIdx}`); if(el) el.innerText += val; }
    function delNum(tIdx) { SFX.button(); const el = document.getElementById(`ans-in-${tIdx}`); if(el) el.innerText = el.innerText.slice(0,-1); }

    function submitAnswer(tIdx, mcAnswer = null) {
      const qIdx = gameState.selectedCardIndex;
      const q = activeWorkspace.questions[qIdx];
      let userAns = mcAnswer;
      
      if (!mcAnswer) {
        const el = document.getElementById(`ans-in-${tIdx}`);
        userAns = el ? el.innerText.trim() : '';
      }
      if (!userAns) return;

      // Clean HTML tags and standardize formatting for comparison
      let keyToMatch = q.ans.replace(/<[^>]*>?/gm, '').trim().replace(/,/g, '.');
      if (q.type === 'mc' && keyToMatch.match(/^[A-D]\./i)) keyToMatch = keyToMatch.charAt(0).toUpperCase();

      let userToMatch = userAns.toUpperCase().replace(/,/g, '.');

      const isCorrect = userToMatch === keyToMatch;
      const box = document.getElementById(`adaptor-${tIdx}`);

      if (isCorrect) {
        SFX.correct();
        box.classList.add('neon-correct');
        const cfg = activeWorkspace.gameConfig;
        if(cfg.mode === 'solo') gameState.scores.solo += 100; else gameState.scores.teams[tIdx] += 100;
        
        gameState.answeredIndices.add(qIdx);
        setTimeout(() => {
          closeQuestionModal();
          renderArenaBoardView();
          if(gameState.answeredIndices.size >= activeWorkspace.questions.length) finishGameSession("SEMUA SOAL SELESAI!");
        }, 800);
      } else {
        SFX.wrong();
        box.classList.add('neon-wrong');
        setTimeout(() => box.classList.remove('neon-wrong'), 1000);
        if(!mcAnswer) document.getElementById(`ans-in-${tIdx}`).innerText = '';
      }
    }

    function exitArenaEarly() {
      if(confirm("Yakin ingin mengakhiri permainan sekarang?")) {
        clearInterval(gameState.timerInterval); finishGameSession("PERMAINAN DIAKHIRI");
      }
    }

    async function finishGameSession(reason) {
      gameState.active = false; SFX.victory();
      const arena = document.getElementById('gameplay-arena');
      const cfg = activeWorkspace.gameConfig;
      
      if(cfg.mode === 'solo') {
          await saveScoreToCloud(activeWorkspace.currentPlayerName, gameState.scores.solo);
      } else {
          cfg.teamNames.forEach((name, idx) => { saveScoreToCloud(name, gameState.scores.teams[idx]); });
      }
      
      let html = `<div class="w-full h-full flex items-center justify-center p-6 bg-[#020611]/95 backdrop-blur-md animate-fadeIn z-50 absolute inset-0">
        <div class="bg-brandPanel border border-brandCyan rounded-3xl p-8 max-w-lg w-full text-center shadow-neon-cyan-lg">
          <h1 class="font-tech text-3xl font-bold text-white mb-2">${reason}</h1>
          <p class="text-brandCyan font-mono mb-2">Pertandingan Selesai</p>
          <p class="text-[10px] text-emerald-400 mb-8"><i data-lucide="check-circle" class="w-3 h-3 inline"></i> Nilai otomatis terkirim ke Dashboard Guru</p>
      `;

      if(cfg.mode === 'solo') {
        html += `<div class="text-6xl font-tech text-amber-400 font-extrabold mb-8">${gameState.scores.solo} <span class="text-sm text-brandMuted">Pts</span></div>`;
      } else {
        const sorted = cfg.teamNames.map((n, i) => ({name: n, score: gameState.scores.teams[i]})).sort((a,b)=>b.score - a.score);
        html += `<div class="space-y-3 mb-8 text-left">
          ${sorted.map((t, i) => `
            <div class="p-3 rounded-xl bg-[#050b18] border ${i===0?'border-amber-400':'border-brandCyan/20'} flex justify-between items-center">
              <span class="font-bold text-white"><span class="text-brandMuted mr-2">#${i+1}</span>${t.name}</span>
              <span class="font-tech text-amber-400 font-bold">${t.score} Pts</span>
            </div>
          `).join('')}
        </div>`;
      }

      html += `<div class="flex justify-center gap-4">
        <button onclick="document.getElementById('gameplay-arena').remove(); openGameLobby()" class="btn-secondary px-6 py-3 rounded-xl font-bold text-sm">Kembali ke Lobi</button>
      </div></div></div>`;
      
      arena.innerHTML = html;
      lucide.createIcons();
    }
  </script>

  <script>
    window.onload = function() { renderAuthView('login'); lucide.createIcons(); };
  </script>
</body>
</html>
